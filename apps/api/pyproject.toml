[project]
name = "labour-youth-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "sqlalchemy[asyncio]>=2.0,<3", "asyncpg>=0.30,<1", "alembic>=1.14,<2", "geoalchemy2>=0.16,<1", "pydantic-settings>=2.7,<3", "argon2-cffi>=23.1", "PyJWT>=2.10,<3", "email-validator>=2.2,<3", "phonenumbers>=8.13", "python-multipart>=0.0.20", "jsonschema>=4.23,<5", "httpx>=0.28,<1"]
[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.9"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
[tool.ruff]
line-length = 110
